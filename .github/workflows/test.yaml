name: Test

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  darwin-rebuild:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Keep darwin-rebuild ref in sync with Makefile / flake.nix (nix-darwin-25.11)
      - run: make /nix
      - run: make /opt/homebrew/bin/brew
      - name: before-nix-darwin-overwrite
        run: |
          sudo mv /etc/bashrc /etc/bashrc.before-nix-darwin
          sudo mv /etc/zshrc /etc/zshrc.before-nix-darwin
      - name: darwin-rebuild
        run: |
          sudo /nix/var/nix/profiles/default/bin/nix \
            --experimental-features 'nix-command flakes' \
            run \
            'git+https://github.com/nix-darwin/nix-darwin.git?ref=nix-darwin-25.11#darwin-rebuild' \
            -- \
            switch --flake .#test
